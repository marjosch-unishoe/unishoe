<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniShoe</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>

<body>

<div class="app">

  <h1>💜 UniShoe</h1>

  <!-- AUTH -->
  <section>
    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Mot de passe">

    <button onclick="registerUser()">S'inscrire</button>
    <button onclick="loginUser()">Connexion</button>
    <button onclick="logoutUser()">Déconnexion</button>

    <p id="welcome"></p>
  </section>

  <!-- PROFILE -->
  <section>
    <select id="userIntent">
      <option value="">Je veux...</option>
      <option value="match">Trouver</option>
      <option value="exchange">Échanger</option>
    </select>

    <select id="profileShoeSide">
      <option value="">Côté</option>
      <option value="gauche">Gauche</option>
      <option value="droite">Droite</option>
    </select>

    <button onclick="saveProfile()">Sauvegarder profil</button>
  </section>

  <!-- ADD -->
  <section>
    <input id="title" placeholder="Titre">
    <input id="size" placeholder="Pointure">
    <input id="city" placeholder="Ville">

    <input type="file" id="photoFile">

    <select id="adShoeSide">
      <option value="">Côté chaussure</option>
      <option value="gauche">Gauche</option>
      <option value="droite">Droite</option>
    </select>

    <button onclick="addAd()">Publier</button>
  </section>

  <!-- ADS -->
  <section>
    <h2>Annonces</h2>
    <div id="ads"></div>
  </section>

</div>

<script src="script.js"></script>

</body>
</html>
